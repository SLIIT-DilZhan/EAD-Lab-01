<!DOCTYPE html>
<html>
    <head>
        <title>Student Grade Service</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body {
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
                background: #f4f6f8;
                color: #222;
            }

            .container {
                width: 92%;
                max-width: 760px;
                margin: 45px auto;
                background: #fff;
                border: 1px solid #ddd;
                border-radius: 6px;
                padding: 28px;
            }

            .header {
                border-bottom: 1px solid #e2e2e2;
                margin-bottom: 24px;
                padding-bottom: 16px;
            }

            h1 {
                margin: 0 0 8px;
                font-size: 28px;
                font-weight: 700;
                color: #1f3f68;
            }

            .header p {
                margin: 0;
                color: #666;
                line-height: 1.5;
            }

            form {
                margin-top: 12px;
            }

            .form-row {
                margin-bottom: 18px;
            }

            label {
                display: block;
                margin-bottom: 7px;
                font-weight: bold;
            }

            input[type="text"],
            input[type="number"] {
                width: 100%;
                padding: 10px;
                font-size: 15px;
                border: 1px solid #bbb;
                border-radius: 4px;
                box-sizing: border-box;
            }

            input[type="text"]:focus,
            input[type="number"]:focus {
                outline: none;
                border-color: #1f6fb2;
            }

            input[type="submit"] {
                background: #1f6fb2;
                color: white;
                border: none;
                border-radius: 4px;
                padding: 11px 18px;
                font-size: 15px;
                cursor: pointer;
            }

            input[type="submit"]:hover {
                background: #19598f;
            }

            .grade-table {
                margin-top: 28px;
            }

            .grade-table h2 {
                font-size: 20px;
                margin: 0 0 12px;
                color: #333;
            }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            th,
            td {
                border: 1px solid #ddd;
                padding: 10px;
                text-align: left;
            }

            th {
                background: #eef3f8;
            }

            .note {
                margin-top: 18px;
                padding: 12px;
                background: #fff8e6;
                border-left: 4px solid #e0a800;
                color: #555;
                font-size: 14px;
            }

            @media (max-width: 520px) {
                .container {
                    margin: 20px auto;
                    padding: 20px;
                }

                h1 {
                    font-size: 24px;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h1>Student Grade Evaluation</h1>
                <p>Enter the student name and mark to calculate the grade.</p>
            </div>

            <form action="api/gradeservice" method="POST">
                <div class="form-row">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName" name="studentName" value="John" required>
                </div>

                <div class="form-row">
                    <label for="mark">Mark</label>
                    <input type="number" id="mark" name="mark" value="82" min="0" max="100" required>
                </div>

                <input type="submit" value="Calculate Grade">
            </form>

            <div class="grade-table">
                <h2>Grade Criteria</h2>
                <table>
                    <tr>
                        <th>Marks Range</th>
                        <th>Grade</th>
                    </tr>
                    <tr>
                        <td>75 - 100</td>
                        <td>A</td>
                    </tr>
                    <tr>
                        <td>65 - 74</td>
                        <td>B</td>
                    </tr>
                    <tr>
                        <td>55 - 64</td>
                        <td>C</td>
                    </tr>
                    <tr>
                        <td>45 - 54</td>
                        <td>D</td>
                    </tr>
                    <tr>
                        <td>Below 45</td>
                        <td>F</td>
                    </tr>
                </table>
            </div>

            <p class="note">Use a mark between 0 and 100.</p>
        </div>
    </body>
</html>
